name: Deploy frontend to GitHub Pages

# The visualizer, algorithm catalogue and comparison workspace run entirely in
# the browser, so the front end can be published as a static demo. The Django
# API is not deployed here — VITE_DEMO_MODE hides the account-backed routes.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: 'true'
          VITE_AUTOSAVE_RUNS: 'false'
          VITE_GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build:pages

      - uses: actions/configure-pages@v5
        # Turns Pages on via the API on the first run, so no manual repo
        # setting is needed before the very first deploy.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
